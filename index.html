<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quota Lamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Chivo:wght@700;900&display=swap">
<style>
  :root{
    --bg:#06090A; --panel:#0D1315; --edge:#1B2528; --edge-hi:#27353A;
    --dim:#5E6E73; --mid:#8FA1A7; --hi:#DCE7EA;
    --green:#31D07B; --amber:#F2B23C; --red:#FF6B4A; --blue:#4A9EDB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--hi)}
  body{
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    min-height:100svh; display:flex; flex-direction:column;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    font-variant-numeric:tabular-nums;
  }
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
  .brand{font-family:"Chivo",sans-serif;font-weight:900;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid)}
  .clock{font-size:11px;letter-spacing:.1em;color:var(--dim)}

  .stack{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}

  .gauge{
    background:var(--panel);border:1px solid var(--edge);border-radius:3px;
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:14px;
    position:relative; overflow:hidden;
  }
  .gauge::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--edge-hi);
    transition:background .4s ease;
  }
  .gauge[data-s="green"]::before{background:var(--green)}
  .gauge[data-s="amber"]::before{background:var(--amber)}
  .gauge[data-s="red"]::before{background:var(--red)}
  .gauge[data-s="none"]::before{background:var(--edge-hi)}

  .ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .gname{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);line-height:1.5}
  .gsub{font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-top:3px}
  .gval{font-family:"Chivo",sans-serif;font-weight:900;font-size:46px;line-height:.85;letter-spacing:-.03em;color:var(--edge-hi);transition:color .4s ease}
  .gval small{font-size:20px;font-weight:700;letter-spacing:0}
  .gval .ph{color:var(--edge-hi);letter-spacing:.06em}
  .gauge[data-s="green"] .gval{color:var(--green)}
  .gauge[data-s="amber"] .gval{color:var(--amber)}
  .gauge[data-s="red"]   .gval{color:var(--red)}

  .bar{display:flex;gap:3px;height:22px}
  .bar i{flex:1;background:#161F22;border-radius:1px;transition:background .35s ease}
  .bar i.on-green{background:var(--green)}
  .bar i.on-amber{background:var(--amber)}
  .bar i.on-red{background:var(--red)}

  .gfoot{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;color:var(--dim)}
  .gfoot b{color:var(--mid);font-weight:500}

  .status{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--edge);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    font-size:11px;letter-spacing:.08em;color:var(--dim);
  }
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}
  .dot.stale{background:var(--blue)}
  .dot.dead{background:var(--red)}
  button{
    font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--mid);border:1px solid var(--edge-hi);
    border-radius:2px;padding:7px 12px;cursor:pointer;
  }
  button:hover{color:var(--hi);border-color:var(--mid)}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .note{margin-top:10px;font-size:10.5px;line-height:1.6;color:var(--dim);letter-spacing:.04em}
  .note b{color:var(--amber);font-weight:500}
  body.stale .gauge{opacity:.55}

  @media (min-width:620px){
    body{padding:34px 30px;max-width:640px;margin:0 auto;width:100%}
    .gval{font-size:60px}
    .bar{height:26px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <div class="top">
    <span class="brand">Quota Lamp</span>
    <span class="clock" id="clock">—</span>
  </div>

  <div class="stack">

    <section class="gauge" id="g-five" data-s="none">
      <div class="ghead">
        <div>
          <div class="gname">5-hour session</div>
          <div class="gsub" id="five-reset">waiting for first reading</div>
        </div>
        <div class="gval" id="five-val"><span class="ph">··</span></div>
      </div>
      <div class="bar" id="five-bar"></div>
      <div class="gfoot"><span>used</span><span id="five-left">—</span></div>
    </section>

    <section class="gauge" id="g-week" data-s="none">
      <div class="ghead">
        <div>
          <div class="gname">Weekly · all models</div>
          <div class="gsub" id="week-reset">waiting for first reading</div>
        </div>
        <div class="gval" id="week-val"><span class="ph">··</span></div>
      </div>
      <div class="bar" id="week-bar"></div>
      <div class="gfoot"><span>used</span><span id="week-left">—</span></div>
    </section>

  </div>

  <div class="status">
    <span><span class="dot" id="dot"></span><span id="freshness">connecting…</span></span>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <div class="note" id="note"></div>

<script>
(function(){
  var SEGS = 14, STALE = 30*60, DEAD = 6*60*60;
  var els = {};
  ['clock','five-val','five-reset','five-bar','five-left','week-val','week-reset','week-bar','week-left','freshness','dot','note','g-five','g-week']
    .forEach(function(id){ els[id] = document.getElementById(id); });

  ['five-bar','week-bar'].forEach(function(id){
    var f = document.createDocumentFragment();
    for (var i=0;i<SEGS;i++) f.appendChild(document.createElement('i'));
    els[id].appendChild(f);
  });

  function band(p){ if (p == null) return 'none'; if (p >= 85) return 'red'; if (p >= 60) return 'amber'; return 'green'; }

  function until(ts){
    if (!ts) return null;
    var s = ts - Math.floor(Date.now()/1000);
    if (s <= 0) return 'now';
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
    if (d > 0) return d + 'd ' + h + 'h';
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm';
  }

  function ago(s){
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + ' min ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function paint(key, pct, resets){
    var b = band(pct), g = els['g-'+key];
    g.setAttribute('data-s', b);
    els[key+'-val'].innerHTML = (pct == null ? '<span class="ph">··</span>' : Math.round(pct) + '<small>%</small>');
    els[key+'-left'].textContent = pct == null ? '—' : (100 - Math.round(pct)) + '% left';
    var lit = pct == null || pct <= 0 ? 0 : Math.max(1, Math.round(pct/100*SEGS));
    var segs = els[key+'-bar'].children;
    for (var i=0;i<segs.length;i++){
      segs[i].className = i < lit ? 'on-' + (b === 'none' ? 'green' : b) : '';
    }
    var u = until(resets);
    els[key+'-reset'].textContent = u ? 'resets in ' + u : 'no reset time yet';
  }

  var last = null;

  function render(){
    els.clock.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    if (!last) return;
    paint('five', last.five, last.five_resets);
    paint('week', last.week, last.week_resets);

    if (!last.updated){
      els.freshness.textContent = 'no reading yet';
      els.dot.className = 'dot stale';
      document.body.classList.remove('stale');
      els.note.innerHTML = 'Waiting for the first reading. Start a Claude Code session on the Mac and the numbers appear within a couple of minutes.';
      return;
    }
    var age = Math.floor(Date.now()/1000) - last.updated;
    els.freshness.textContent = 'Mac reported ' + ago(age);
    els.dot.className = 'dot' + (age > DEAD ? ' dead' : age > STALE ? ' stale' : '');
    document.body.classList.toggle('stale', age > STALE);
    els.note.innerHTML = age > DEAD
      ? '<b>No reading in hours.</b> Claude Code has not run on the Mac, so these are the last numbers it saw — not what is true now.'
      : age > STALE
      ? '<b>Going stale.</b> Nothing has run on the Mac for a while. Usage may have moved on the web or phone without being counted here.'
      : '';
  }

  function load(){
    fetch('usage.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ last = d; render(); })
      .catch(function(){
        if (!last){ els.freshness.textContent = 'no reading yet — run Claude Code once'; els.dot.className = 'dot stale'; }
      });
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
  load();
  setInterval(load, 30000);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
